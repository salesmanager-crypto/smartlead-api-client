<style>
  :root{
    --bg:#150A0B; --surface:#201113; --surface-alt:#241417; --border:#34191C;
    --text:#F2EDED; --text-secondary:#C9B9BA; --text-tertiary:#8F7A7C;
    --accent:#FF4D82; --accent-deep:#B10548; --danger:#FF6B52;
    /* #E51958 is the ring pink used across albertscott.com. */
    --ring:rgba(229,25,88,.72);
    --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--text);font:400 15px/1.5 var(--font);
       -webkit-font-smoothing:antialiased}
  /* The albertscott.com hero motif: a tiled grid of hollow crimson rings over
     a deep crimson corner wash. Layer order is top-down -- the vignette sits
     above the rings and fades them out behind the card, so the form stays the
     focus while the pattern still reads at the edges.
     One tile = one ring: transparent core, band from 44px to 57px, transparent
     outside, repeated on a 140px grid to match the site's circle pitch. */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 660px 580px at 50% 50%, rgba(21,10,11,.96), rgba(21,10,11,.80) 44%, rgba(21,10,11,0) 76%),
      radial-gradient(900px 500px at 12% -10%, rgba(177,5,72,.34), transparent 62%),
      radial-gradient(760px 460px at 105% 8%, rgba(255,77,130,.16), transparent 58%),
      radial-gradient(circle, rgba(0,0,0,0) 0 44px, var(--ring) 44px 57px, rgba(0,0,0,0) 57px);
    background-size:cover,cover,cover,140px 140px;
    background-position:center,center,center,center;}
  @media (max-width:520px){
    /* Tighter pitch so a phone still shows a grid rather than one stray ring. */
    body::before{background-size:cover,cover,cover,104px 104px;
      background-image:
        radial-gradient(ellipse 420px 460px at 50% 50%, rgba(21,10,11,.96), rgba(21,10,11,.80) 44%, rgba(21,10,11,0) 78%),
        radial-gradient(900px 500px at 12% -10%, rgba(177,5,72,.34), transparent 62%),
        radial-gradient(760px 460px at 105% 8%, rgba(255,77,130,.16), transparent 58%),
        radial-gradient(circle, rgba(0,0,0,0) 0 32px, var(--ring) 32px 42px, rgba(0,0,0,0) 42px);}}
  .card{position:relative;z-index:1;width:min(100%,384px);background:var(--surface);
    border:1px solid var(--border);border-radius:16px;padding:36px 32px 30px;
    box-shadow:0 18px 50px -12px rgba(0,0,0,.72), 0 0 0 1px rgba(255,77,130,.05)}
  .brand{text-align:center;margin-bottom:26px}
  .mark{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;
    border-radius:12px;background:linear-gradient(145deg,var(--accent),var(--accent-deep));
    font-weight:900;font-size:17px;letter-spacing:.02em;color:#fff;margin-bottom:14px;
    box-shadow:0 6px 18px -4px rgba(177,5,72,.65)}
  .name{font-size:19px;font-weight:800;letter-spacing:-.015em;margin:0}
  .tag{margin:5px 0 0;font-size:12px;font-weight:500;letter-spacing:.07em;
    text-transform:uppercase;color:var(--accent)}
  .sub{margin:16px 0 0;font-size:13px;color:var(--text-tertiary)}
  label{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;
    color:var(--text-secondary);margin:0 0 6px}
  .field{margin-bottom:14px}
  input{width:100%;padding:11px 13px;font:400 15px/1.4 var(--font);color:var(--text);
    background:var(--surface-alt);border:1px solid var(--border);border-radius:9px;
    transition:border-color .15s, box-shadow .15s}
  input::placeholder{color:#6B5457}
  input:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(255,77,130,.16)}
  /* Scoped to the submit button by id, so the reveal toggle below does not
     inherit the full-width pill styling. */
  #b{width:100%;margin-top:8px;padding:12px;font:600 15px/1 var(--font);color:#fff;
    background:linear-gradient(145deg,var(--accent),var(--accent-deep));
    border:0;border-radius:9px;cursor:pointer;transition:filter .15s, transform .05s}
  #b:hover:not(:disabled){filter:brightness(1.08)}
  #b:active:not(:disabled){transform:translateY(1px)}
  #b:disabled{opacity:.62;cursor:progress}
  .pw{position:relative}
  /* Room for the toggle so a long password never runs under it. */
  .pw input{padding-right:46px}
  #t{position:absolute;top:50%;right:7px;transform:translateY(-50%);
    width:32px;height:32px;padding:0;margin:0;display:grid;place-items:center;
    background:transparent;border:0;border-radius:7px;color:var(--text-tertiary);
    cursor:pointer;transition:color .15s, background .15s}
  #t:hover{color:var(--text-secondary);background:rgba(255,77,130,.12)}
  #t:focus-visible{outline:2px solid var(--accent);outline-offset:1px;color:var(--text-secondary)}
  #t svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;
    stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  /* This id+element selector outranks the UA's [hidden]{display:none}, so the
     inactive icon needs saying explicitly or both would stack. */
  #t svg[hidden]{display:none}
  .err{min-height:18px;margin-top:11px;text-align:center;font-size:13px;color:var(--danger)}
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--border);
    text-align:center;font-size:11px;letter-spacing:.03em;color:var(--text-tertiary)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main class="card">
  <div class="brand">
    <div class="mark">AS</div>
    <h1 class="name">Albert Scott</h1>
    <p class="tag">Amazon. Expertise. Delivered.</p>
    <p class="sub">Sign in to the Command Center</p>
  </div>
  <form id="f" autocomplete="on">
    <div class="field">
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username" autocapitalize="none"
             spellcheck="false" autofocus placeholder="username">
    </div>
    <div class="field">
      <label for="p">Password</label>
      <div class="pw">
        <input id="p" name="password" type="password" autocomplete="current-password"
               placeholder="password">
        <button id="t" type="button" aria-label="Show password" aria-pressed="false"
                aria-controls="p" title="Show password">
          <svg id="i1" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="i2" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M2 12s3.6-6.5 10-6.5c1.9 0 3.5.6 4.8 1.3M22 12s-3.6 6.5-10 6.5c-1.9 0-3.5-.6-4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m3 3 18 18"/></svg>
        </button>
      </div>
    </div>
    <button id="b" type="submit">Sign in</button>
    <div class="err" id="e" role="alert" aria-live="polite"></div>
  </form>
  <div class="foot">Authorised access only</div>
</main>

var KEY="cc-session";
var NUL=String.fromCharCode(0);
function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}

// Unwrap this account's copy of the content key, then decrypt the dashboard.
// A wrong username and a wrong password fail the same way: AES-GCM
// authentication rejects the unwrap, so neither is confirmed separately.
function unlock(name,pass){
  var id=String(name||"").trim().toLowerCase();
  var rec=U[id],ck="";
  if(!rec) return Promise.reject(new Error("bad credentials"));
  var input=new TextEncoder().encode(id+NUL+pass);
  return crypto.subtle.importKey("raw",input,"PBKDF2",false,["deriveKey"])
    .then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(rec.s),iterations:D.iter,hash:"SHA-256"},
        base,{name:"AES-GCM",length:256},false,["decrypt"]);})
    .then(function(kek){
      return crypto.subtle.decrypt({name:"AES-GCM",iv:u8(rec.i)},kek,u8(rec.w));})
    .then(function(raw){
      // keep the content key: the dashboard needs it to decrypt its person-level data files
      ck=btoa(String.fromCharCode.apply(null,new Uint8Array(raw)));
      return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);})
    .then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.iv)},key,u8(D.ct));})
    .then(function(buf){return new TextDecoder().decode(buf).split("%%"+"CONTENT_KEY%%").join(ck)});
}
function render(html){document.open();document.write(html);document.close()}

// Reveal toggle. Press once to show the password, again to hide it.
// SVGElement does not reflect a .hidden property onto the attribute the way
// HTMLElement does, so setting el.hidden here would leave both icons visible.
// The attribute has to be set and removed explicitly.
function show1(el,on){ if(on) el.removeAttribute("hidden"); else el.setAttribute("hidden",""); }
function setReveal(show){
  p.type=show?"text":"password";
  show1(i1,!show); show1(i2,show);
  t.setAttribute("aria-pressed",show?"true":"false");
  t.setAttribute("aria-label",show?"Hide password":"Show password");
  t.setAttribute("title",show?"Hide password":"Show password");
}
t.onclick=function(){
  setReveal(p.type==="password");
  // Keep the caret where it was so typing can continue uninterrupted.
  var end=p.value.length;
  p.focus();
  try{p.setSelectionRange(end,end)}catch(_){}
};

// Stay signed in across reloads for the life of the tab, and keep supporting a
// bookmarked #u=...&p=... link. A fragment is never sent to the server, unlike
// a ?query=, and it is stripped from the address bar once read.
(function(){
  var name=null,pass=null,fromHash=false;
  var h=location.hash||"";
  var mu=/[#&]u=([^&]*)/.exec(h), mp=/[#&]p=([^&]*)/.exec(h);
  if(mu&&mp){
    try{name=decodeURIComponent(mu[1]);pass=decodeURIComponent(mp[1])}catch(_){name=mu[1];pass=mp[1]}
    fromHash=true;
  }else{
    try{var c=JSON.parse(sessionStorage.getItem(KEY)||"null");if(c){name=c.n;pass=c.p}}catch(_){}
  }
  function scrub(){try{if(fromHash)history.replaceState(null,"",location.pathname+location.search)}catch(_){}}
  if(!name||!pass){return}
  f.hidden=true;
  unlock(name,pass).then(function(html){
    try{sessionStorage.setItem(KEY,JSON.stringify({n:name,p:pass}))}catch(_){}
    scrub();render(html);
  }).catch(function(){
    try{sessionStorage.removeItem(KEY)}catch(_){}
    scrub();f.hidden=false;
    e.textContent="Those saved credentials no longer work.";u.focus();
  });
})();

f.onsubmit=function(ev){
  ev.preventDefault();
  if(!u.value.trim()||!p.value){e.textContent="Enter a username and password.";return}
  b.disabled=true;e.textContent="";b.textContent="Signing in...";
  unlock(u.value,p.value).then(function(html){
    try{sessionStorage.setItem(KEY,JSON.stringify({n:u.value.trim().toLowerCase(),p:p.value}))}catch(_){}
    render(html);
  }).catch(function(){
    e.textContent="Incorrect username or password.";
    b.disabled=false;b.textContent="Sign in";
    // The field is cleared, so drop back to masked rather than leaving the
    // next attempt revealed on screen.
    p.value="";setReveal(false);p.focus();
  });
};
