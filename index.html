const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY="cc-pass";

async function unlock(pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(D.salt),iterations:D.iter,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.iv)},key,u8(D.ct));
  return new TextDecoder().decode(buf);
}
const render=html=>{document.open();document.write(html);document.close();};

// Auto-unlock, so the bookmarked link opens straight to the dashboard.
// The passphrase rides in the URL *fragment* (#p=...), which browsers never
// send to the server -- a ?query= would end up in GitHub's request logs.
// On reload it comes from sessionStorage instead, since the fragment is
// stripped from the address bar as soon as it has been read.
(async()=>{
  let pass=null, fromHash=false;
  const m=/[#&]p=([^&]+)/.exec(location.hash||"");
  if(m){ try{pass=decodeURIComponent(m[1]);}catch(_){pass=m[1];} fromHash=true; }
  else { try{pass=sessionStorage.getItem(KEY);}catch(_){} }
  if(!pass) return;
  const scrub=()=>{ try{ if(fromHash) history.replaceState(null,"",location.pathname+location.search); }catch(_){} };
  f.hidden=true;
  try{
    const html=await unlock(pass);
    try{sessionStorage.setItem(KEY,pass);}catch(_){}
    scrub(); render(html);
  }catch(_){
    try{sessionStorage.removeItem(KEY);}catch(_){}
    scrub(); f.hidden=false;
    e.textContent="That link's passphrase is wrong."; p.focus();
  }
})();

f.onsubmit=async ev=>{
  ev.preventDefault(); b.disabled=true; e.textContent=""; b.textContent="Decrypting\u2026";
  try{
    const html=await unlock(p.value);
    try{sessionStorage.setItem(KEY,p.value);}catch(_){}
    render(html);
  }catch(_){
    e.textContent="Wrong passphrase."; b.disabled=false; b.textContent="Unlock"; p.select();
  }
};
</script></body></html>
