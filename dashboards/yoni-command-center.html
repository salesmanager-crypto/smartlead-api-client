<title>Yoni Sales & Marketing Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1D0000;
    --crimson: #B10548;
    --pink: #E51958;

    --bg: #F2F2F2;
    --surface: #FFFFFF;
    --surface-alt: #FAFAFA;
    --border: #E6E4E4;

    --text: #1A1A1A;
    --text-secondary: #5A5A5A;
    --text-tertiary: #8A8A8A;
    --accent-text: #B10548;

    --inverse-bg: #1D0000;
    --inverse-fg: #FFFFFF;

    --success-fg: #137A4D; --success-bg: #E8F3ED;
    --warning-fg: #B8860B; --warning-bg: #F8F1DF;
    --danger-fg:  #CC3311; --danger-bg:  #FBEAE6;
    --neutral-fg: #5A5A5A; --neutral-bg: #EFEFEF;

    --chart-crimson: #B10548;
    --chart-blue:    #1F6FEB;
    --chart-amber:   #B26A00;
    --chart-purple:  #7A3BD1;
    --chart-green:   #4C7A1F;

    --shadow: 0 1px 2px rgba(29,0,0,.045), 0 14px 30px -16px rgba(29,0,0,.14);

    --r-card: 20px; --r-sub: 14px; --r-btn: 9px; --r-pill: 999px;
    --font-display: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #150A0B; --surface: #201113; --surface-alt: #241417; --border: #34191C;
      --text: #F2EDED; --text-secondary: #C9B9BA; --text-tertiary: #8F7A7C; --accent-text: #FF4D82;
      --inverse-bg: #201113; --inverse-fg: #F2EDED;
      --success-fg: #4ADE9A; --success-bg: #16261D;
      --warning-fg: #F0C24B; --warning-bg: #2E2410;
      --danger-fg:  #FF6B52; --danger-bg:  #331512;
      --neutral-fg: #C9B9BA; --neutral-bg: #2A1A1C;
      --chart-crimson: #E8447D; --chart-blue: #4C8EE8; --chart-amber: #B87A20; --chart-purple: #9868DE; --chart-green: #6B9A3A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 34px -16px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #150A0B; --surface: #201113; --surface-alt: #241417; --border: #34191C;
    --text: #F2EDED; --text-secondary: #C9B9BA; --text-tertiary: #8F7A7C; --accent-text: #FF4D82;
    --inverse-bg: #201113; --inverse-fg: #F2EDED;
    --success-fg: #4ADE9A; --success-bg: #16261D;
    --warning-fg: #F0C24B; --warning-bg: #2E2410;
    --danger-fg:  #FF6B52; --danger-bg:  #331512;
    --neutral-fg: #C9B9BA; --neutral-bg: #2A1A1C;
    --chart-crimson: #E8447D; --chart-blue: #4C8EE8; --chart-amber: #B87A20; --chart-purple: #9868DE; --chart-green: #6B9A3A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 34px -16px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-display); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(177,5,72,.22); }
  a { color: inherit; text-decoration: none; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  h1, h2, h3, p { margin: 0; }
  ol, ul { margin: 0; padding: 0; list-style: none; }
  .tnum { font-variant-numeric: tabular-nums; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; border-radius: 4px; }
  .thin-scroll::-webkit-scrollbar { width: 7px; height: 7px; }
  .thin-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  .thin-scroll::-webkit-scrollbar-track { background: transparent; }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .001ms !important; animation-duration: .001ms !important; } }

  /* shell */
  .shell { display: flex; min-height: 100vh; }
  .rail { width: 88px; flex-shrink: 0; background: var(--ink); border-radius: 0 20px 20px 0; display: none; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px 0 18px; position: sticky; top: 0; height: 100vh; }
  @media (min-width: 780px) { .rail { display: flex; } }
  .rail-logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(155deg, var(--crimson), var(--pink)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 12px; flex-shrink: 0; }
  .rail-nav { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; }
  .rail-btn { position: relative; width: 72px; height: 54px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: rgba(242,237,237,.5); transition: background .15s, color .15s; }
  .rail-btn .lbl { font-size: 9px; font-weight: 700; letter-spacing: .2px; line-height: 1; white-space: nowrap; }
  .rail-btn svg { width: 19px; height: 19px; }
  .rail-btn:hover { color: rgba(242,237,237,.9); background: rgba(242,237,237,.08); }
  .rail-btn.active { background: var(--inverse-fg); color: var(--ink); }
  .rail-btn.disabled-ish { opacity: .55; }
  .rail-badge { position: absolute; top: 4px; right: 8px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 999px; background: var(--pink); color: #fff; font-size: 8.5px; font-weight: 800; line-height: 14px; text-align: center; }
  .rail-foot { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: auto; }
  .rail-avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(242,237,237,.12); color: var(--inverse-fg); display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; border: 1px solid rgba(242,237,237,.18); }

  .main { flex: 1; min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--border); }
  .topbar-inner { max-width: 1360px; margin: 0 auto; padding: 13px 26px; display: flex; align-items: center; gap: 14px; }
  @media (min-width: 700px) { .topbar-inner { padding: 13px 28px; } }
  .search-pill { display: flex; align-items: center; gap: 8px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--r-pill); padding: 8px 14px 8px 12px; flex: 1; max-width: 340px; transition: border-color .15s; }
  .search-pill:focus-within { border-color: var(--accent-text); }
  .search-pill svg { width: 15px; height: 15px; color: var(--text-tertiary); flex-shrink: 0; }
  .search-pill input { border: none; background: none; outline: none; width: 100%; color: var(--text); font-size: 12.5px; }
  .search-pill input::placeholder { color: var(--text-tertiary); }
  .topbar-spacer { flex: 1; }
  .date-pill { font-size: 12px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; display: none; }
  @media (min-width: 900px) { .date-pill { display: block; } }
  .user-chip { display: flex; align-items: center; gap: 9px; padding-left: 6px; }
  .user-avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; background: var(--inverse-bg); color: var(--inverse-fg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }
  .user-meta { display: none; line-height: 1.3; }
  @media (min-width: 620px) { .user-meta { display: block; } }
  .user-name { font-size: 12.5px; font-weight: 700; }
  .user-role { font-size: 10.5px; color: var(--text-tertiary); }

  .content { max-width: 1360px; margin: 0 auto; padding: 26px; }
  @media (min-width: 700px) { .content { padding: 28px; } }
  .page-head { margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .page-head h1 { font-size: 27px; font-weight: 800; letter-spacing: -.6px; }
  .page-head p { margin-top: 5px; font-size: 13px; color: var(--text-secondary); max-width: 640px; }
  .live-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--success-fg); background: var(--success-bg); border-radius: var(--r-pill); padding: 4px 11px; white-space: nowrap; }
  .live-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .section { margin-bottom: 26px; }
  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-tertiary); margin-bottom: 12px; }

  .info-note, .flag-note { display: flex; gap: 10px; align-items: flex-start; border-radius: var(--r-sub); padding: 12px 14px; font-size: 12.5px; line-height: 1.55; }
  .info-note { background: var(--surface-alt); border: 1px solid var(--border); color: var(--text-secondary); }
  .flag-note { background: var(--warning-bg); border: 1px solid transparent; color: var(--warning-fg); }
  .danger-note { background: var(--danger-bg); color: var(--danger-fg); border: 1px solid transparent; }
  .info-note svg, .flag-note svg, .danger-note svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; }
  .info-note strong, .flag-note strong, .danger-note strong { color: var(--text); font-weight: 700; }
  .flag-note strong { color: var(--warning-fg); }
  .danger-note strong { color: var(--danger-fg); }

  .empty-page { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 30px; }
  .empty-page h3 { font-size: 16.5px; font-weight: 700; margin-bottom: 8px; }
  .empty-page p { font-size: 13px; color: var(--text-secondary); max-width: 620px; margin-bottom: 6px; }
  .empty-page ul { margin: 12px 0 0; }
  .empty-page li { font-size: 13px; color: var(--text-secondary); padding: 5px 0 5px 18px; position: relative; }
  .empty-page li::before { content: ""; position: absolute; left: 2px; top: 12px; width: 5px; height: 5px; border-radius: 50%; background: var(--text-tertiary); }

  .kpi-row { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 620px) { .kpi-row { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1080px) { .kpi-row.cols-4 { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 900px) { .kpi-row.cols-3 { grid-template-columns: repeat(3, 1fr); } }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; color: inherit; }
  a.kpi-card { transition: transform .15s, border-color .15s; }
  a.kpi-card:hover { transform: translateY(-1px); border-color: var(--accent-text); }
  a.kpi-card.hero:hover { border-color: transparent; }
  .kpi-card.hero { background: linear-gradient(150deg, var(--ink), var(--crimson)); border-color: transparent; color: #fff; }
  .kpi-card.unavailable { background: var(--surface-alt); }
  .kpi-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .kpi-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .55px; color: var(--text-tertiary); }
  .kpi-card.hero .kpi-label { color: rgba(255,255,255,.72); }
  .kpi-icon { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; background: var(--surface-alt); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; }
  .kpi-icon svg { width: 16px; height: 16px; }
  .kpi-card.hero .kpi-icon { background: rgba(255,255,255,.14); color: #fff; }
  .kpi-value { font-size: 31px; font-weight: 800; letter-spacing: -.4px; }
  .kpi-value.na { font-size: 18px; color: var(--text-tertiary); }
  .kpi-caption { font-size: 12px; color: var(--text-secondary); margin-top: -6px; }
  .kpi-card.hero .kpi-caption { color: rgba(255,255,255,.82); }
  .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: var(--r-pill); padding: 3px 10px; font-size: 11px; font-weight: 700; width: fit-content; white-space: nowrap; }
  .pill.success { background: var(--success-bg); color: var(--success-fg); }
  .pill.warning { background: var(--warning-bg); color: var(--warning-fg); }
  .pill.danger  { background: var(--danger-bg);  color: var(--danger-fg); }
  .pill.neutral { background: var(--neutral-bg); color: var(--neutral-fg); }
  .kpi-card.hero .pill { background: rgba(255,255,255,.16); color: #fff; }
  .pill .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  .exception-row { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 900px) { .exception-row { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 900px) { .exception-row.cols-2 { grid-template-columns: repeat(2, 1fr); } }
  .exc-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .exc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .exc-head h3 { font-size: 14.5px; font-weight: 700; }
  .exc-head .tag { font-size: 10.5px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .5px; }
  .bar-list { display: flex; flex-direction: column; gap: 9px; }
  .bar-list-row { display: flex; align-items: center; gap: 10px; }
  .bar-list-label { font-size: 11.5px; color: var(--text-secondary); width: 100px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-list-track { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-alt); overflow: hidden; }
  .bar-list-fill { height: 100%; border-radius: 999px; background: var(--crimson); }
  .bar-list-val { font-size: 12px; font-weight: 700; width: 34px; text-align: right; flex-shrink: 0; }
  .stat-pair { display: flex; gap: 18px; flex-wrap: wrap; }
  .stat-pair .s { flex: 1; min-width: 80px; }
  .stat-pair .v { font-size: 22px; font-weight: 800; }
  .stat-pair .l { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

  .list-preview { display: flex; flex-direction: column; }
  .list-preview a { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .list-preview a:last-child { border-bottom: none; }
  .list-preview .t { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-preview .m { color: var(--text-tertiary); flex-shrink: 0; }

  .chart-row { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 900px) { .chart-row { grid-template-columns: 1.5fr 1fr; } }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 18px 20px 20px; }
  .chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .chart-head h3 { font-size: 16.5px; font-weight: 700; }
  .chart-head p { font-size: 11.5px; color: var(--text-tertiary); margin-top: 3px; }
  .toggle-link { font-size: 11px; font-weight: 700; color: var(--accent-text); border: 1px solid var(--border); border-radius: var(--r-btn); padding: 5px 9px; white-space: nowrap; flex-shrink: 0; }
  .toggle-link:hover { border-color: var(--accent-text); }
  .bars-wrap { display: flex; align-items: flex-end; gap: 14px; height: 170px; padding: 0 4px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar-shape-wrap { flex: 1; display: flex; align-items: flex-end; width: 100%; justify-content: center; }
  .bar-shape { width: 36px; border-radius: 6px 6px 0 0; }
  .bar-value { font-size: 14px; font-weight: 800; margin-bottom: 6px; }
  .bar-caption { font-size: 10.5px; font-weight: 700; color: var(--text-secondary); margin-top: 10px; text-align: center; }
  .bar-sub { font-size: 10px; color: var(--text-tertiary); margin-top: 1px; }
  .donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .donut-ring { position: relative; width: 122px; height: 122px; flex-shrink: 0; }
  .donut-ring .hole { position: absolute; inset: 18px; border-radius: 50%; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-ring .hole .n { font-size: 18px; font-weight: 800; }
  .donut-ring .hole .l { font-size: 9px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .4px; }
  .legend { display: flex; flex-direction: column; gap: 7px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .legend-name { color: var(--text-secondary); width: 76px; flex-shrink: 0; }
  .legend-val { font-weight: 700; }
  .legend-pct { color: var(--text-tertiary); font-size: 10.5px; }
  .plain-table { width: 100%; border-collapse: collapse; font-size: 12.5px; display: none; }
  .plain-table.shown { display: table; }
  .plain-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-tertiary); font-weight: 700; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  .plain-table td { padding: 8px 8px; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
  .plain-table td.n { text-align: right; font-weight: 700; color: var(--text); }
  .chart-visual.hidden { display: none; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { border-radius: var(--r-pill); background: var(--surface-alt); border: 1px solid var(--border); padding: 6px 13px; font-size: 12px; font-weight: 600; color: var(--text-secondary); transition: background .15s, color .15s, border-color .15s; }
  .chip:hover { border-color: var(--accent-text); color: var(--accent-text); }
  .chip.active { background: var(--inverse-bg); color: var(--inverse-fg); border-color: var(--inverse-bg); }
  .segmented { display: inline-flex; background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--r-btn); padding: 3px; gap: 2px; }
  .segmented button { border-radius: 7px; padding: 6px 14px; font-size: 12px; font-weight: 600; color: var(--text-secondary); transition: background .15s, color .15s; white-space: nowrap; }
  .segmented button:hover { color: var(--text); }
  .segmented button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(29,0,0,.12); }
  .segmented button .n { margin-left: 5px; color: var(--text-tertiary); font-weight: 700; }
  .segmented button.active .n { color: var(--accent-text); }
  /* level indicator: a value against a threshold */
  .level { display: flex; flex-direction: column; gap: 4px; }
  .level-track { position: relative; height: 6px; border-radius: 999px; background: var(--surface-alt); overflow: visible; }
  .level-fill { height: 100%; border-radius: 999px; background: var(--danger-fg); }
  .level-mark { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--text); border-radius: 1px; }
  .level-scale { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-tertiary); }
  .kpi-card.hero .level-track { background: rgba(255,255,255,.18); } .kpi-card.hero .level-fill { background: #fff; } .kpi-card.hero .level-mark { background: rgba(255,255,255,.7); }
  /* truncation with the full value in a tooltip */
  .data-table td.trunc { max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 20px; }
  .table-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 18px 20px 14px; }
  .table-head h3 { font-size: 16.5px; font-weight: 700; }
  .count-badge { font-family: var(--font-display); font-size: 11px; font-weight: 700; background: var(--surface-alt); color: var(--text-secondary); border-radius: var(--r-pill); padding: 2px 9px; }
  .table-head-sub { font-size: 11.5px; color: var(--text-tertiary); flex-basis: 100%; margin-top: -6px; }
  .table-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .btn-primary { background: var(--crimson); color: #fff; font-weight: 700; font-size: 12px; border-radius: var(--r-btn); padding: 8px 14px; white-space: nowrap; transition: background .15s; }
  .btn-primary:hover { background: var(--pink); }
  .chip-row.in-head { padding: 0 20px 14px; }
  .table-scroll { overflow: auto; max-height: 560px; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 680px; }
  .data-table thead th { position: sticky; top: 0; z-index: 1; text-align: left; background: var(--surface-alt); font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; font-weight: 700; color: var(--text-tertiary); padding: 9px 18px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .data-table thead th button { display: inline-flex; align-items: center; gap: 4px; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; font-weight: inherit; padding: 0; }
  .data-table thead th button:hover { color: var(--accent-text); }
  .data-table thead th.sorted button { color: var(--accent-text); }

function pageHead(title, sub, live) {

    (live ? '<span class="live-pill"><span class="dot"></span>Pulled ' + DATA_DATE + '</span>' : '') + '</div>';
}
function sortRows(rows, key, dir) {
  const out = rows.slice();
  out.sort(function (a, b) {
    let av = a[key], bv = b[key];
    if (typeof av === "string") av = av.toLowerCase();
    if (typeof bv === "string") bv = bv.toLowerCase();
    if (av == null) av = "";
    if (bv == null) bv = "";
    if (av < bv) return dir === "asc" ? -1 : 1;
    if (av > bv) return dir === "asc" ? 1 : -1;
    return 0;
  });
  return out;
}
function wireSort(tableId, getSort, setSort, renderFn) {
  document.getElementById(tableId).querySelectorAll("thead th[data-sort]").forEach(function (th) {
    th.addEventListener("click", function () {
      const key = th.getAttribute("data-sort");
      const cur = getSort();
      const next = cur.key === key ? { key: key, dir: cur.dir === "asc" ? "desc" : "asc" } : { key: key, dir: "asc" };
      setSort(next);
      document.getElementById(tableId).querySelectorAll("thead th").forEach(function (t) { t.classList.toggle("sorted", t === th); });
      renderFn();
    });
  });
}
function wireToggle(id) {
  const btn = document.querySelector('[data-toggle="' + id + '"]');
  if (!btn) return;
  btn.addEventListener("click", function () {
    const visual = document.getElementById(id + "-visual");
    const table = document.getElementById(id + "-table");
    const showingTable = table.classList.contains("shown");
    table.classList.toggle("shown", !showingTable);
    visual.classList.toggle("hidden", !showingTable);
    btn.textContent = showingTable ? "Plain table" : "Chart view";
  });
}

/* ================= SmartLead: daily inbox log with Pipedrive sync check ================= */
function renderInboxLog() {
  const days = [];
  const byDay = {};
  INBOX_LOG.forEach(function (r) {
    const d = r.day || r.t.slice(0, 10);
    if (!byDay[d]) { byDay[d] = { rows: [], total: 0, qualifying: 0, synced: 0, gaps: 0, uncategorized: 0, cats: {} }; days.push(d); }
    const b = byDay[d]; b.rows.push(r); b.total++;
    const cat = r.cat || "Uncategorized"; b.cats[cat] = (b.cats[cat] || 0) + 1;
    if (r.status === "synced" || r.status === "gap") b.qualifying++;
    if (r.status === "synced") b.synced++;
    if (r.status === "gap") b.gaps++;
    if (r.status === "uncategorized") b.uncategorized++;
  });
  days.sort().reverse();
  const today = byDay[TODAY] || { rows: [], total: 0, qualifying: 0, synced: 0, gaps: 0, uncategorized: 0, cats: {} };
  const todayCats = Object.keys(today.cats).sort(function (a, b) { return today.cats[b] - today.cats[a]; });
  const totalGaps = days.reduce(function (a, d) { return a + byDay[d].gaps; }, 0);
  const firstDay = days[days.length - 1];

  let html = '<section class="section">' +
    '<div class="table-card" id="inboxLog">' +
      '<div class="table-head"><h3>Daily inbox log</h3><span class="count-badge tnum">' + INBOX_LOG.length + ' replies, ' + days.length + ' days</span>' +
        '<div class="table-actions"><a class="btn-primary" href="https://app.smartlead.ai/app/master-inbox" target="_blank" rel="noopener">Open Master Inbox</a></div>' +
        '<p class="table-head-sub">Every Master Inbox reply since ' + fmtDay(firstDay) + ', the category SmartLead assigned, and whether a Pipedrive person with that email exists. ' +
        'Interested, Meeting Request, and Follow Up are the categories the automation syncs, so one of those with no Pipedrive record is flagged <strong>Sync missing</strong>. Times are Eastern.</p>' +
      '</div>' +

      '<div class="summary-strip">' +
        '<div class="mini-stat"><div class="mini-label">Logged today (' + fmtDay(TODAY) + ')</div><div class="mini-value tnum">' + today.total + '</div><div class="mini-sub">' + today.uncategorized + ' still uncategorized</div></div>' +
        '<div class="mini-stat"><div class="mini-label">Should sync</div><div class="mini-value tnum">' + today.qualifying + '</div><div class="mini-sub">Interested, Meeting Request, Follow Up</div></div>' +
        '<div class="mini-stat"><div class="mini-label">Synced to Pipedrive</div><div class="mini-value tnum" style="color:var(--success-fg)">' + today.synced + '</div><div class="mini-sub">of ' + today.qualifying + ' that should be</div></div>' +
        '<div class="mini-stat' + (today.gaps ? ' alert' : '') + '"><div class="mini-label">Sync missing</div><div class="mini-value tnum">' + today.gaps + '</div><div class="mini-sub">' + (today.gaps ? 'Tagged but no Pipedrive record' : 'Nothing broken today') + '</div></div>' +
        '<div class="mini-stat wide"><div class="mini-label">Today by category</div><div class="cat-chips">' +
          (todayCats.length ? todayCats.map(function (c) { return '<span class="cat-chip"><span class="legend-dot" style="background:' + catColor(c) + '"></span>' + esc(c) + ' <b class="tnum">' + today.cats[c] + '</b></span>'; }).join("") : '<span class="mini-sub">No replies yet today</span>') +
        '</div></div>' +
      '</div>' +

      '<div class="rolling"><div class="rolling-head"><h4>Day over day</h4><span class="tag">' + (totalGaps ? totalGaps + ' sync gap' + (totalGaps === 1 ? '' : 's') + ' in the window' : 'No sync gaps in the window') + '</span></div>' +
      '<div class="table-scroll thin-scroll"><table class="data-table rolling-table"><thead><tr><th>Day</th><th>Replies</th><th>Should sync</th><th>Synced</th><th>Sync missing</th><th>Uncategorized</th><th>Mix</th></tr></thead><tbody>' +
      days.map(function (d) {
        const b = byDay[d]; const cats = Object.keys(b.cats).sort(function (x, y) { return b.cats[y] - b.cats[x]; });
        return '<tr' + (d === TODAY ? ' class="is-today"' : '') + '><td class="mono tnum">' + fmtDay(d, true) + (d === TODAY ? ' <span class="pill neutral">Today</span>' : '') + '</td>' +
          '<td class="n tnum">' + b.total + '</td><td class="n tnum">' + b.qualifying + '</td><td class="n tnum" style="color:var(--success-fg)">' + b.synced + '</td>' +
          '<td class="n tnum"' + (b.gaps ? ' style="color:var(--danger-fg)"' : '') + '>' + b.gaps + (b.gaps ? ' &#9650;' : '') + '</td><td class="n tnum">' + b.uncategorized + '</td>' +
          '<td><span class="mix-bar">' + cats.map(function (c) { return '<span title="' + esc(c) + ': ' + b.cats[c] + '" style="width:' + (b.cats[c] / b.total * 100).toFixed(1) + '%;background:' + catColor(c) + '"></span>'; }).join("") + '</span></td></tr>';
      }).join("") +
      '</tbody></table></div></div>' +

      days.map(function (d) {
        const b = byDay[d];
        return '<details class="log-day"' + (d === TODAY ? ' open' : '') + '><summary><span class="log-day-title">' + fmtDay(d, true) + '</span>' +
          '<span class="log-day-meta"><span class="tnum">' + b.total + ' replies</span>' + (b.gaps ? '<span class="pill danger"><span class="dot"></span>' + b.gaps + ' sync missing</span>' : '') + (b.uncategorized ? '<span class="pill warning"><span class="dot"></span>' + b.uncategorized + ' awaiting category</span>' : '') + '</span>' +
          '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></summary>' +
          '<div class="table-scroll thin-scroll"><table class="data-table log-table"><thead><tr><th>Time (ET)</th><th>Lead</th><th>Email</th><th>Campaign</th><th>Category</th><th>Synced</th><th>Pipedrive</th><th>Status</th></tr></thead><tbody>' +
          b.rows.map(function (r) {
            return '<tr' + (r.status === "gap" ? ' class="row-gap"' : '') + '><td class="mono tnum">' + fmtTimeET(r.t) + '</td><td class="subject">' + esc(leadLabel(r)) + '</td><td class="mono">' + esc(r.email) + '</td><td class="trunc" title="' + esc(r.campaign || "") + '">' + esc(r.campaign || "") + '</td>' +
              '<td>' + catPill(r.cat) + '</td><td class="n">' + (r.pd ? 'Yes' : 'No') + '</td>' +
              '<td>' + (r.pd ? pdLink("person", r.pd, "Person #" + r.pd) : '<span style="color:var(--text-tertiary)">&#8212;</span>') + '</td>' +
              '<td>' + statusPill(r.status) + '</td></tr>';
          }).join("") +
          '</tbody></table></div></details>';
      }).join("") +
    '</div>' +
  '</section>';
  return html;
}
