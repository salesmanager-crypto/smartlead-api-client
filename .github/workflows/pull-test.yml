name: Pull test (temporary, stage 3)

# Temporary: exercises scripts/pull/run-all.mjs against the real APIs with the
# repository secrets while the pipeline is being built on this branch, and commits
# the generated data back to the branch. Replaced by daily-refresh.yml in stage 4.
on:
  push:
    branches: [claude/determined-lamport-6btkt8]
    paths:
      - "scripts/pull/**"
      - "src/client.js"
      - "src/heyreach.js"
      - "src/pipedrive.js"
      - "scripts/build-*.mjs"
      - "dashboard/**"
      - ".github/workflows/pull-test.yml"

permissions:
  contents: write

concurrency:
  group: dashboard-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull every source
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          SMARTLEAD_BASE_URL: ${{ secrets.SMARTLEAD_BASE_URL }}
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          PIPEDRIVE_COMPANY_DOMAIN: ${{ secrets.PIPEDRIVE_COMPANY_DOMAIN }}
          HEYREACH_API_KEY: ${{ secrets.HEYREACH_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SEO_TRACKER_FILE_ID: ${{ secrets.SEO_TRACKER_FILE_ID }}
          SEO_TRACKER_TAB: ${{ secrets.SEO_TRACKER_TAB }}
          DASHBOARD_CONTENT_KEY: ${{ secrets.DASHBOARD_CONTENT_KEY }}
        run: node scripts/pull/run-all.mjs
      - name: Build both dashboards
        env:
          DASHBOARD_CONTENT_KEY: ${{ secrets.DASHBOARD_CONTENT_KEY }}
        run: |
          node scripts/build-pages.mjs
          node scripts/build-artifact.mjs
      - name: Commit the data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: pull test $(date -u +%Y-%m-%d)"
          # the branch may have moved while the pull ran; data files are only ever written here
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
