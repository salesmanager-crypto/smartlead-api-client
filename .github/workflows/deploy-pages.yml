name: Deploy dashboard

# Manual only, on purpose. A GitHub Pages site is publicly readable even when
# the repository is private, and the built dashboard contains real prospect
# names, email addresses and deal values. Run this only if you intend to publish
# that data to the open web.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only the dashboard for publishing
        run: |
          mkdir -p _site
          cp -L dashboard/command-center.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4